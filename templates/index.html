<html>
<head>
    <title>Sample app</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <h1>Register Router</h1>
    <form method="POST" action="/add">
    <label for="ip">IP:</label>
    <input name="ip" placeholder="IP Address" required />
    <label for="yourname">Username:</label>
    <input name="yourname" placeholder="Username" required />
    <label for="password">Password:</label>
    <input name="message" placeholder="Password" required />
    <button type="submit">Add</button>
    </form>

    <h2>Routers List</h2>
  <ul>
    {% for comment in data %}
      <li>
	       {{ comment.ip_address }} - {{ comment.username }}	 
        <form method="POST" action="{{ url_for('delete_comment') }}" style="display:inline">
               <input type="hidden" name="doc_id" value="{{ comment._id }}">
               <button type="submit">Delete</button>
        </form>
      </li>
    {% endfor %}
  </ul>

</body>
</html>
